<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sign In — [Company] Security</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="assets/admin.css">
<script>(function(){try{var o=sessionStorage.getItem("theme-override");var h=new Date().getHours();document.documentElement.setAttribute("data-theme",o||((h>=7&&h<19)?"light":"dark"));}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
</head><body>
<div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="login-wrap">
  <div class="glass login-card">
    <a class="brand" href="../index.html" style="margin-bottom:18px"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></span><span>[Company]<small>Security</small></span></a>
    <h2 style="font-size:1.5rem">Admin sign in</h2>
    <p style="color:var(--ink-3);font-size:.92rem;margin-bottom:18px">Authorized personnel only.</p>
    <form id="loginForm" novalidate>
      <div class="field" style="margin-bottom:14px"><label>Email</label><input type="email" name="email" required placeholder="admin@example.com"><span class="err"></span></div>
      <div class="field" style="margin-bottom:14px"><label>Password</label><input type="password" name="password" required placeholder="••••••••"><span class="err"></span></div>
      <div class="form-status" role="status" aria-live="polite"></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" style="margin-top:8px">Sign In</button>
    </form>
  </div>
</div>
<script src="assets/admin.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target, st = f.querySelector('.form-status'), btn = f.querySelector('button');
  var email = f.email.value.trim(), password = f.password.value;
  if (!email || !password) { st.className='form-status show bad'; st.textContent='Enter email and password.'; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Signing in…';
  ADMIN.req('/login', { method:'POST', body: JSON.stringify({ email: email, password: password }) })
    .then(function (r) {
      if (r.ok && r.body.success) { location.href = 'dashboard.html'; }
      else { st.className='form-status show bad'; st.textContent = (r.body && r.body.message) || 'Sign in failed.'; btn.disabled=false; btn.textContent='Sign In'; }
    })
    .catch(function () { st.className='form-status show bad'; st.textContent='Could not reach the server.'; btn.disabled=false; btn.textContent='Sign In'; });
});
</script>
<script src="../assets/js/theme.js" defer></script>
</body></html>
