<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sign In — VNT Security</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="assets/admin.css">
<script>(function(){try{var o=sessionStorage.getItem("theme-override");var h=new Date().getHours();document.documentElement.setAttribute("data-theme",o||((h>=7&&h<19)?"light":"dark"));}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
</head><body>
<div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="login-wrap">
  <div class="glass login-card">
    <a class="brand" href="../index.html" style="margin-bottom:18px"><span class="mark" aria-hidden="true"></span><span>VNT<small>Security</small></span></a>

    <div id="loginView">
      <h2 style="font-size:1.5rem">Admin sign in</h2>
      <p style="color:var(--ink-3);font-size:.92rem;margin-bottom:18px">Authorized personnel only.</p>
      <form id="loginForm" novalidate onsubmit="return false">
        <div class="field" style="margin-bottom:14px"><label>Email</label><input type="email" name="email" autocomplete="username" required placeholder="admin@example.com"><span class="err"></span></div>
        <div class="field" style="margin-bottom:14px"><label>Password</label><input type="password" name="password" autocomplete="current-password" required placeholder="••••••••"><span class="err"></span></div>
        <div id="recaptcha" style="margin-bottom:14px"></div>
        <div class="form-status" role="status" aria-live="polite"></div>
        <button id="loginBtn" class="btn btn-primary btn-block btn-lg" type="button" style="margin-top:8px">Sign In</button>
      </form>
      <p style="margin-top:14px;text-align:center;font-size:.9rem"><a href="#" id="forgotLink">Forgot password?</a></p>
    </div>

    <div id="forgotView" style="display:none">
      <h2 style="font-size:1.5rem">Reset password</h2>
      <p style="color:var(--ink-3);font-size:.92rem;margin-bottom:18px">Enter your admin email and we'll send a reset link.</p>
      <form id="forgotForm" novalidate onsubmit="return false">
        <div class="field" style="margin-bottom:14px"><label>Email</label><input type="email" name="email" required placeholder="admin@example.com"><span class="err"></span></div>
        <div class="form-status" role="status" aria-live="polite"></div>
        <button id="forgotBtn" class="btn btn-primary btn-block btn-lg" type="button" style="margin-top:8px">Send reset link</button>
      </form>
      <p style="margin-top:14px;text-align:center;font-size:.9rem"><a href="#" id="backLink">← Back to sign in</a></p>
    </div>
  </div>
</div>
<script src="../assets/js/captcha.js"></script>
<script>
(function () {
  'use strict';
  var API = (window.SITE_CONFIG && window.SITE_CONFIG.apiBase || '/api') + '/admin';
  function g(id){return document.getElementById(id);}
  var provider = 'none', widgetId = null;

  // Adaptive: the captcha stays hidden and is only shown if the server reports
  // too many failed attempts (likely brute force).
  g('recaptcha').style.display = 'none';

  if (location.search.indexOf('timeout=1') > -1) {
    var s0 = document.querySelector('#loginForm .form-status'); s0.className='form-status show bad'; s0.textContent='Your session timed out. Please sign in again.';
  }

  // ---- sign in ----
  var lForm = g('loginForm'), lBtn = g('loginBtn'), lSt = lForm.querySelector('.form-status'), busy = false;
  function login() {
    if (busy) return;
    var email = lForm.email.value.trim(), password = lForm.password.value;
    if (!email || !password) { lSt.className='form-status show bad'; lSt.textContent='Enter email and password.'; return; }
    var token = '';
    if (window.SiteCaptcha && SiteCaptcha.isShown('recaptcha')) {
      token = SiteCaptcha.token('recaptcha');
      if (!token) { lSt.className='form-status show bad'; lSt.textContent='Please complete the verification, then sign in.'; return; }
    }
    busy = true; lBtn.disabled = true; var old = lBtn.innerHTML; lBtn.innerHTML = '<span class="spinner"></span> Signing in…'; lSt.className='form-status';
    fetch(API + '/login', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({ email: email, password: password, captchaToken: token }) })
      .then(function (r) { return r.json().catch(function(){return{};}).then(function (j) { return { ok:r.ok, j:j }; }); })
      .then(function (res) {
        if (res.ok && res.j && res.j.success) { location.href = 'dashboard.html'; return; }
        busy = false; lBtn.disabled = false; lBtn.innerHTML = old;
        lSt.className='form-status show bad'; lSt.textContent = (res.j && res.j.message) || 'Sign in failed.';
        if (res.j && res.j.captchaRequired && window.SiteCaptcha) { SiteCaptcha.show('recaptcha'); }
        else if (window.SiteCaptcha && SiteCaptcha.isShown('recaptcha')) { SiteCaptcha.reset('recaptcha'); }
      })
      .catch(function () { busy=false; lBtn.disabled=false; lBtn.innerHTML=old; lSt.className='form-status show bad'; lSt.textContent='Could not reach the server.'; });
  }
  lBtn.addEventListener('click', login);
  lForm.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); login(); } });

  // ---- forgot ----
  g('forgotLink').addEventListener('click', function (e){ e.preventDefault(); g('loginView').style.display='none'; g('forgotView').style.display=''; });
  g('backLink').addEventListener('click', function (e){ e.preventDefault(); g('forgotView').style.display='none'; g('loginView').style.display=''; });
  var fForm = g('forgotForm'), fBtn = g('forgotBtn'), fSt = fForm.querySelector('.form-status');
  function forgot() {
    var email = fForm.email.value.trim();
    if (!email) { fSt.className='form-status show bad'; fSt.textContent='Enter your email.'; return; }
    fBtn.disabled = true; var old = fBtn.innerHTML; fBtn.innerHTML = '<span class="spinner"></span> Sending…';
    fetch(API + '/forgot', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: email }) })
      .then(function (r){ return r.json().catch(function(){return{};}); })
      .then(function (j) { fBtn.disabled=false; fBtn.innerHTML=old; fSt.className='form-status show ok'; fSt.textContent = (j && j.message) || 'If that email belongs to an admin, a reset link has been sent.'; })
      .catch(function () { fBtn.disabled=false; fBtn.innerHTML=old; fSt.className='form-status show bad'; fSt.textContent='Could not reach the server.'; });
  }
  fBtn.addEventListener('click', forgot);
  fForm.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); forgot(); } });
})();
</script>
<script src="../assets/js/theme.js" defer></script>
</body></html>
